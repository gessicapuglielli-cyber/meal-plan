<style>
/* ── TOKENS ── */
:root {
  --f0:#091410; --f1:#0E1F16; --f2:#162A1E; --f3:#1A3428; --f4:#244D38;
  --f5:#2E6347; --f6:#3D7A50; --sage:#4A8C5C; --bright:#6AAF7A; --pale:#A8D4B4;
  --clay:#C17F5A; --gold:#D4A94A; --cream:#EFF5EE;
  --bg:#0A1810; --surf:#111F16; --card:#162C20;
  --txt:#E8F5EC; --mid:#9DCBA8; --soft:#6A9A78; --div:rgba(106,175,122,.15);
  --on:#6AAF7A; --on-b:#0A2214; --off:#7FA4CC; --off-b:#0A1828;
  --cheat:#D4A07A; --cheat-b:#281406;
  --gess:#C4A0E8; --gess-b:#160E28; --sophie:#7FA4CC; --soph-b:#0A1828;
  --both:#6AAF7A; --both-b:#0A2214;
  --r:20px; --rs:14px; --rx:8px;
  font-size:16px;
}
[data-theme="light"] {
  --f0:#F5F0E8; --f1:#EDE8DF; --f2:#E2DDD4; --f3:#FFF; --f4:#F0EBE1;
  --bg:#F0EBE1; --surf:#E8E3DA; --card:#FFF;
  --txt:#1A2018; --mid:#4A6050; --soft:#8A9A88; --div:rgba(28,58,42,.1);
  --on:#2E6B38; --on-b:#D6EDD9; --off:#3A5E8A; --off-b:#D4E4F4;
  --cheat:#9A5A32; --cheat-b:#F2E0D0;
  --gess:#6A42A0; --gess-b:#EAE0F6; --sophie:#3A5E8A; --soph-b:#D4E4F4;
  --both:#2E6B38; --both-b:#D6EDD9;
  --bright:#3D8C50; --pale:#7ABF8A; --clay:#C17F5A; --cream:#1A2018;
}

/* ── RESET ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
/* PWA standalone mode: ensure no content hidden under status bar */
@media (display-mode: standalone) {
  .hdr { padding-top: max(env(safe-area-inset-top, 20px), 16px); }
}

/* ── APP SHELL ── */
#app{display:flex;flex-direction:column;height:100dvh;max-width:430px;margin:0 auto;background:var(--bg);overflow:hidden;}

/* ── HEADER ── */
.hdr{
  padding:16px 24px 14px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0; background:var(--bg);
  border-bottom:1px solid var(--div);
}
.hdr-title{font-family:'Fraunces',serif;font-size:21px;font-weight:200;color:var(--txt);letter-spacing:-.5px;}
.hdr-title em{font-style:italic;color:var(--bright);}
.hdr-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--div);background:var(--surf);color:var(--mid);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.hdr-btn svg{width:18px;height:18px;}

/* ── BOTTOM NAV ── */
.nav{
  display:flex;background:#1C3A2A;
  flex-shrink:0;
  padding-bottom:env(safe-area-inset-bottom);
}
[data-theme="dark"] .nav{background:#0A1810;border-top:1px solid var(--div);}
.nav-btn{
  flex:1;padding:10px 2px 8px;border:none;background:none;cursor:pointer;
  font-family:'DM Sans',sans-serif;font-size:10px;font-weight:400;
  color:rgba(168,210,176,.5);
  display:flex;flex-direction:column;align-items:center;gap:4px;
  transition:color .2s; position:relative; letter-spacing:.03em;
}
.nav-btn svg{width:22px;height:22px;flex-shrink:0;}
.nav-btn.active{color:#A8D4B0;}
.nav-btn.active::before{
  content:'';position:absolute;top:0;left:28%;right:28%;
  height:2px;background:#6AAF7A;border-radius:0 0 3px 3px;
}

/* ── SCROLL ── */
.pages{flex:1;overflow:hidden;position:relative;}
.page{display:none;height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;}
.page.active{display:block;}

/* ══════════════════════════════════════════════
   TODAY SCREEN
══════════════════════════════════════════════ */
.today-hdr{
  padding:26px 24px 20px;
  background:linear-gradient(175deg,var(--f4) 0%,var(--f1) 100%);
  border-bottom:1px solid var(--div);
}
.today-date{font-size:12px;font-weight:500;color:var(--soft);text-transform:uppercase;letter-spacing:.12em;margin-bottom:10px;}
.today-greet{font-family:'Fraunces',serif;font-size:36px;font-weight:200;line-height:1.1;color:var(--txt);}
.today-greet em{font-style:italic;color:var(--bright);}
.today-meta{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap;}
.meta-pill{font-size:12px;font-weight:500;padding:5px 13px;border-radius:20px;letter-spacing:.02em;}

/* Training row */
.train-row{
  display:flex;align-items:center;gap:14px;
  padding:14px 22px;background:var(--surf);
  border-bottom:1px solid var(--div);
}
.train-lbl{font-size:15px;font-weight:300;color:var(--mid);flex:1;}
.tog{width:50px;height:28px;background:var(--div);border-radius:14px;position:relative;cursor:pointer;border:none;transition:background .25s;flex-shrink:0;}
.tog.on{background:var(--sage);}
.tog::after{content:'';position:absolute;width:22px;height:22px;background:white;border-radius:50%;top:3px;left:3px;transition:transform .25s cubic-bezier(.34,1.56,.64,1);box-shadow:0 2px 8px rgba(0,0,0,.3);}
.tog.on::after{transform:translateX(22px);}

/* Workout banner */
.wod-banner{
  margin:14px 16px 0;padding:14px 20px;
  background:linear-gradient(135deg,var(--f5),var(--sage));
  border-radius:var(--rs);color:white;
}

.wod-text{font-size:14px;line-height:1.55;font-weight:300;}

.carousel-wrap{
  padding:20px 0 28px;
  position:relative;
}
.carousel-dots{
  display:flex;gap:6px;justify-content:center;
  margin-bottom:10px;
}
.c-tabs{
  display:flex;gap:6px;justify-content:center;
  margin-bottom:14px;
}
.c-tab{
  font-family:'DM Sans',sans-serif;
  font-size:12px;font-weight:500;
  padding:6px 16px;border-radius:20px;
  border:1.5px solid var(--div);
  background:none;color:var(--soft);
  cursor:pointer;transition:all .2s;
  letter-spacing:.02em;
}
.c-tab.c-tab-active{
  background:var(--sage);color:white;border-color:var(--sage);
}
[data-theme="light"] .c-tab.c-tab-active{
  background:#1C3A2A;color:white;border-color:#1C3A2A;
}
.dot{width:5px;height:5px;border-radius:50%;background:var(--div);transition:all .3s;}
.dot.active{width:20px;border-radius:3px;background:var(--bright);}

.carousel-track-wrap{
  overflow:visible;padding:0 16px;
  position:relative;
  touch-action:pan-y;
}
.carousel-wrap{overflow:hidden;}
.carousel-track{
  touch-action:pan-y;
  cursor:grab;
}
.carousel-track:active{cursor:grabbing;}
.carousel-track{
  display:flex;gap:12px;
  transition:transform .38s cubic-bezier(.4,0,.2,1);
  will-change:transform;
}
.meal-slide{
  flex:0 0 calc(100% - 48px); /* 92% + gaps for peek effect */
  min-width:0;
  background:var(--card);
  border-radius:var(--r);
  overflow:hidden;
  border:1px solid var(--div);
}

/* Illustration header */
.meal-illus{
  height:140px;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.meal-slot-tag{
  position:absolute;top:14px;left:14px;
  font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.7);background:rgba(0,0,0,.25);
  padding:4px 10px;border-radius:20px;backdrop-filter:blur(4px);
}
.meal-kcal-tag{
  position:absolute;top:14px;right:14px;
  font-size:11px;font-weight:500;
  color:rgba(255,255,255,.8);background:rgba(0,0,0,.2);
  padding:4px 10px;border-radius:20px;backdrop-filter:blur(4px);
}

.meal-body{padding:18px 18px 20px;}
.meal-persons{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;}
.ptag{font-size:11px;font-weight:600;padding:4px 11px;border-radius:20px;letter-spacing:.03em;}
.ptag-both  {background:var(--both-b);color:var(--both);}
.ptag-sophie{background:var(--soph-b);color:var(--sophie);}
.ptag-gess  {background:var(--gess-b);color:var(--gess);}
.meal-title{font-family:'Fraunces',serif;font-size:22px;font-weight:300;color:var(--txt);line-height:1.2;margin-bottom:8px;}
.meal-desc{font-size:14px;color:var(--mid);line-height:1.65;font-weight:300;}
.meal-qty{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px;}
.qchip{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--surf);color:var(--soft);border:1px solid var(--div);}
.meal-nutr{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.nchip{font-size:11px;padding:3px 9px;border-radius:20px;background:rgba(74,140,92,.1);color:var(--bright);border:1px solid rgba(74,140,92,.15);}
.meal-prep{font-size:12px;color:var(--soft);font-style:italic;margin-top:8px;padding:8px 12px;border-left:2px solid var(--sophie);background:rgba(127,164,204,.06);border-radius:0 var(--rx) var(--rx) 0;line-height:1.5;}

/* Person block */
.p-block{margin-bottom:0;}

/* ══════════════════════════════════════════════
   PLAN SCREEN
══════════════════════════════════════════════ */
.plan-week-row{
  padding:14px 16px;display:flex;gap:8px;

}

}
.wk-btn.active{background:var(--sage);color:white;border-color:var(--sage);}
.day-cards-wrap{padding:14px 0 24px;}
.day-entry{
  background:var(--card);border:1px solid var(--div);
  margin:0 16px 10px;border-radius:var(--r);overflow:hidden;
}
.day-hdr-row{
  display:flex;align-items:center;gap:10px;
  padding:16px 18px;cursor:pointer;user-select:none;
}
.day-hdr-row:active{background:var(--surf);}
.day-name{font-family:'Fraunces',serif;font-size:20px;font-weight:300;color:var(--txt);min-width:110px;}
.day-badges-row{display:flex;gap:6px;flex-wrap:wrap;flex:1;}
.dbadge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;}
.db-on  {background:var(--on-b); color:var(--on);}
.db-off {background:var(--off-b);color:var(--off);}
.db-ch  {background:var(--cheat-b);color:var(--cheat);}

.db-kcal{background:var(--surf);color:var(--soft);border:1px solid var(--div);}
.day-chev{font-size:13px;color:var(--soft);margin-left:auto;transition:transform .2s;flex-shrink:0;}
.day-chev.open{transform:rotate(180deg);}
.day-expanded{display:none;border-top:1px solid var(--div);}
.day-expanded.open{display:block;}

/* Swipeable meals inside plan day */
.day-meal-carousel{padding:16px 0 20px;}

══════════════════════════════════════════════ */
.shop-top{

.shop-body{padding:4px 16px 24px;}

.item-tag{font-size:11px;font-weight:500;padding:3px 8px;border-radius:20px;}
.t-rep{background:var(--on-b);color:var(--on);}
.t-sta{background:var(--off-b);color:var(--off);}
.shop-clear{display:block;margin:10px 0 0;padding:13px;text-align:center;font-size:14px;color:var(--soft);font-weight:300;background:none;border:1px solid var(--div);border-radius:var(--rs);cursor:pointer;font-family:'DM Sans',sans-serif;width:100%;}

.spot-cat-hdr::after{content:'';flex:1;height:1px;background:linear-gradient(to right,var(--div),transparent);}

.spot-card-addr{font-size:12px;color:var(--soft);margin-bottom:9px;font-weight:300;}
.spot-card-desc{font-size:14px;color:var(--mid);line-height:1.65;margin-bottom:12px;font-weight:300;}
.spot-tags-row{display:flex;flex-wrap:wrap;gap:5px;}
.stag{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;}
.stag-on  {background:var(--on-b); color:var(--on);}
.stag-off {background:var(--off-b);color:var(--off);}
.stag-sup {background:var(--cheat-b);color:var(--cheat);}

function todayKey(){
  const now = new Date();
  return `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`;
}
function todayDayIndex(){
  const d = new Date().getDay(); // 0=Sun
  return d === 0 ? 6 : d - 1; // Mon=0 ... Sun=6
}

const BG_BY_TYPE = {
  ON: { snack:'linear-gradient(135deg,#1A3D24,#244D38)', lunch:'linear-gradient(135deg,#162A1E,#2E5A40)', dinner:'linear-gradient(135deg,#0E2318,#1C4030)' },

  CHEAT: { snack:'linear-gradient(135deg,#2A1808,#3A2010)', lunch:'linear-gradient(135deg,#281006,#3A180A)', dinner:'linear-gradient(135deg,#201008,#301A0A)' },
};

function illusForSlot(slot, dayType) {
  const bg = (BG_BY_TYPE[dayType] || BG_BY_TYPE.ON)[slot] || BG_BY_TYPE.ON.dinner;
  if (slot === 'dinner') return ILLUS.dinner(bg);
  if (slot === 'snack') return ILLUS.snack(bg);
  if (slot === 'office') return ILLUS.office(bg);
  if (dayType === 'CHEAT') return ILLUS.cheat(bg);
  return ILLUS.lunch(bg);
}

// ── SLIDE BUILDER ─────────────────────────────────────────────────────────────
function buildSlide(sec, slotKey, dayType, kcalVal, isFirst) {
  const illusHtml = illusForSlot(slotKey, dayType);
  const slotLabel = slotKey === 'snack' ? 'Afternoon Snack' : slotKey === 'lunch' ? 'Lunch' : slotKey === 'dinner' ? 'Dinner' : 'Free';
  const kcalTag = isFirst && kcalVal ? `<div class="meal-kcal-tag">~${kcalVal} kcal</div>` : '';

  // Build person blocks
  let personBlocksHtml = '';
  const sections = Array.isArray(sec) ? sec : [sec];

  sections.forEach((s, si) => {
    const pClass = s.who === 'sophie' ? 'ptag-sophie' : s.who === 'gess' ? 'ptag-gess' : 'ptag-both';
    const pLabel = s.who === 'sophie' ? 'Sophie' : s.who === 'gess' ? 'Gess' : 'Both';
    const qtyHtml = s.qty && s.qty.length ? `<div class="meal-qty">${s.qty.map(q=>`<span class="qchip">${q}</span>`).join('')}</div>` : '';
    const nutrHtml = s.nutr && s.nutr.length ? `<div class="meal-nutr">${s.nutr.map(n=>`<span class="nchip">${n}</span>`).join('')}</div>` : '';
    const prepHtml = s.prep ? `<div class="meal-prep">${s.prep}</div>` : '';
    const seaweedHtml = s.seaweed ? `<div class="meal-seaweed">${s.seaweed}</div>` : '';
    const divider = si > 0 ? '<div class="meal-divider"></div>' : '';

    personBlocksHtml += `${divider}
      <div class="p-block">
        <div class="meal-persons"><span class="ptag ${pClass}">${pLabel}</span></div>
        <div class="meal-title">${s.title}</div>
        <div class="meal-desc">${s.desc}</div>
        ${qtyHtml}${nutrHtml}${seaweedHtml}${prepHtml}
      </div>`;
  });

  return `
    <div class="meal-illus">
      ${illusHtml}
      <div class="meal-slot-tag">${slotLabel}</div>
      ${kcalTag}
    </div>
    <div class="meal-body">
      ${personBlocksHtml}
    </div>`;
}

function groupSections(day) {
  const snacks = day.sections.filter(s => s.icon === '🍎' || s.icon === '🥂');
  const lunchSections = day.sections.filter(s => s.icon === '🥗' || s.icon === '📍' || s.icon === '🏖️');
  const dinners = day.sections.filter(s => s.icon === '🌙');
  return { snacks, lunchSections, dinners };
}

function renderToday() {
  const wi = S.currentWeek;
  const di = todayDayIndex();
  const week = WEEKS[wi];
  const day = week.days[di];
  const now = new Date();
  const hr = now.getHours();
  const greet = hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';
  const dayNames = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

  document.getElementById('todayDate').textContent = `${dayNames[di]} · Week ${wi + 1}`;
  document.getElementById('todayGreet').innerHTML = `${greet}, <em>both</em>`;

  // Meta badges
  const typeLabel = day.type === 'CHEAT' ? 'Cheat day' : day.type + ' day';
  const typeCls = day.type === 'ON' ? 'db-on' : day.type === 'OFF' ? 'db-off' : 'db-ch';
  let metaHtml = `<span class="meta-pill dbadge ${typeCls}">${typeLabel}</span>`;
  if (day.office) metaHtml += `<span class="meta-pill dbadge db-off2">Gess office day</span>`;
  document.getElementById('todayMeta').innerHTML = metaHtml;

  // Training toggle
  const key = todayKey();
  const td = S.getTrainingDays();
  const isTrain = !!td[key];
  const tog = document.getElementById('trainTog');
  tog.classList.toggle('on', isTrain);
  tog.onclick = () => {
    const td2 = S.getTrainingDays();
    td2[key] = !td2[key];
    S.setTrainingDays(td2);
    renderToday();
  };

  // Workout banner
  const wod = document.getElementById('wodBanner');
  if (isTrain && day.type !== 'CHEAT') {
    wod.innerHTML = `<div class="wod-banner" style="margin-top:14px">
      <div class="wod-label">Training day add-on</div>
      <div class="wod-text">Post-workout: 200ml fresh apple juice + 250ml fortified plant milk + 20g protein powder</div>
    </div>`;
  } else { wod.innerHTML = ''; }

  const kcalVal = day.type === 'ON' ? week.kcal.on : day.type === 'OFF' ? week.kcal.off : null;
  const { snacks, lunchSections, dinners } = groupSections(day);

  const slides = [];

  // Slide 1: Lunch (default first — most relevant at any time of day)
  if (lunchSections.length) {
    slides.push(buildSlide(lunchSections, 'lunch', day.type, kcalVal, true));
  }

  // Slide 2: Snack
  if (snacks.length) {
    slides.push(buildSlide(snacks, 'snack', day.type, null, false));
  }

  // Slide 3: Dinner
  if (dinners.length) {
    slides.push(buildSlide(dinners, 'dinner', day.type, null, false));
  }

  // If cheat day, just one slide
  if (day.type === 'CHEAT' && !slides.length) {
    slides.push(buildSlide([{who:'both', title:'Cheat day', desc:'No rules today. Enjoy!', qty:[], nutr:[]}], 'cheat', 'CHEAT', null, false));
  }

  const cWrap = document.getElementById('todayCarousel');
  const SLOT_LABELS = ['Lunch','Snack','Dinner'];
  const activeSlots = [];
  if(lunchSections.length) activeSlots.push('Lunch');
  if(snacks.length) activeSlots.push('Snack');
  if(dinners.length) activeSlots.push('Dinner');

  const dotsHtml = slides.length > 1
    ? `<div class="carousel-dots">${slides.map((_,i) => `<div class="dot${i===0?' active':''}"></div>`).join('')}</div>`
    : '';
  const tabsHtml = slides.length > 1
    ? `<div class="c-tabs" id="today-tabs">${activeSlots.map((l,i) => `<button class="c-tab${i===0?' c-tab-active':''}" onclick="todayTabClick(${i})">${l}</button>`).join('')}</div>`
    : '';

  cWrap.innerHTML = dotsHtml + tabsHtml + `<div class="carousel-track-wrap"><div class="carousel-track" id="today-track">${slides.map(s => `<div class="meal-slide">${s}</div>`).join('')}</div></div>`;

  initCarousel('today-track', cWrap.querySelectorAll('.dot'), 'today-tabs');
}

function initCarousel(trackId, dotEls, tabsId) {
  const track = document.getElementById(trackId);
  if (!track) return;
  const slides = Array.from(track.querySelectorAll('.meal-slide'));
  if (!slides.length) return;
  let cur = 0;

  function step() {
    const r = slides[0].getBoundingClientRect();
    return (r.width || 300) + 12;
  }

  function goTo(n, smooth) {
    cur = Math.max(0, Math.min(slides.length - 1, n));
    if (smooth === false) track.style.transition = 'none';
    else track.style.transition = '';
    track.style.transform = `translateX(${-cur * step()}px)`;
    dotEls.forEach((d, i) => d.classList.toggle('active', i === cur));
    if (tabsId) {
      const tabs = document.querySelectorAll(`#${tabsId} .c-tab`);
      tabs.forEach((t, i) => t.classList.toggle('c-tab-active', i === cur));
    }
  }

  // Expose goTo for tab clicks
  track._goTo = goTo;

  // — Pointer events (works in most browsers + newer iOS) —
  let px = 0, py = 0, pActive = false, pHoriz = null;
  track.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    try { track.setPointerCapture(e.pointerId); } catch(err) {}
    px = e.clientX; py = e.clientY; pActive = true; pHoriz = null;
  });
  track.addEventListener('pointermove', e => {
    if (!pActive) return;
    const dx = e.clientX - px, dy = e.clientY - py;
    if (pHoriz === null && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) {
      pHoriz = Math.abs(dx) >= Math.abs(dy);
    }
    if (pHoriz) { e.preventDefault(); e.stopPropagation(); }
  });
  track.addEventListener('pointerup', e => {
    if (!pActive) return; pActive = false;
    if (pHoriz) {
      const dx = e.clientX - px;
      if (Math.abs(dx) > 28) goTo(dx < 0 ? cur + 1 : cur - 1);
    }
  });
  track.addEventListener('pointercancel', () => { pActive = false; });

  // — Touch events fallback (older iOS, WKWebView edge cases) —
  let tx = 0, ty = 0, tActive = false, tHoriz = null;
  track.addEventListener('touchstart', e => {
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
    tActive = true; tHoriz = null;
  }, {passive: true});
  track.addEventListener('touchmove', e => {
    if (!tActive) return;
    const dx = e.touches[0].clientX - tx, dy = e.touches[0].clientY - ty;
    if (tHoriz === null && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) {
      tHoriz = Math.abs(dx) >= Math.abs(dy);
    }
    if (tHoriz) { e.preventDefault(); e.stopPropagation(); }
  }, {passive: false});
  track.addEventListener('touchend', e => {
    if (!tActive) return; tActive = false;
    if (tHoriz) {
      const dx = e.changedTouches[0].clientX - tx;
      if (Math.abs(dx) > 28) goTo(dx < 0 ? cur + 1 : cur - 1);
    }
  });

  requestAnimationFrame(() => requestAnimationFrame(() => goTo(0, false)));
}

window.toggleDay = function(eid, cid, tid, wi, di) {
  const body = document.getElementById(eid);
  const chev = document.getElementById(cid);
  const trackWrap = document.getElementById(tid);
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  if (chev) chev.classList.toggle('open', !isOpen);

  if (!isOpen && trackWrap && !trackWrap.dataset.built) {
    trackWrap.dataset.built = '1';
    const day = WEEKS[wi].days[di];
    const kcalVal = day.type==='ON'?WEEKS[wi].kcal.on:day.type==='OFF'?WEEKS[wi].kcal.off:null;
    const { snacks, lunchSections, dinners } = groupSections(day);
    const slides = [];
    if (lunchSections.length) slides.push(buildSlide(lunchSections,'lunch',day.type,kcalVal,true));
    if (snacks.length) slides.push(buildSlide(snacks,'snack',day.type,null,false));
    if (dinners.length) slides.push(buildSlide(dinners,'dinner',day.type,null,false));

    const carouselId = `plan-track-${wi}-${di}`;
    const tabsId2 = `plan-tabs-${wi}-${di}`;
    const activeSlots2 = [];
    if(lunchSections.length) activeSlots2.push('Lunch');
    if(snacks.length) activeSlots2.push('Snack');
    if(dinners.length) activeSlots2.push('Dinner');
    const dotsHtml = slides.length > 1
      ? `<div class="carousel-dots">${slides.map((_,i)=>`<div class="dot${i===0?' active':''}"></div>`).join('')}</div>` : '';
    const tabsHtml2 = slides.length > 1
      ? `<div class="c-tabs" id="${tabsId2}">${activeSlots2.map((l,i)=>`<button class="c-tab${i===0?' c-tab-active':''}" onclick="planTabClick('${carouselId}',${i})">${l}</button>`).join('')}</div>` : '';
    trackWrap.innerHTML = dotsHtml + tabsHtml2 + `<div class="carousel-track-wrap"><div class="carousel-track" id="${carouselId}">${slides.map(s=>`<div class="meal-slide">${s}</div>`).join('')}</div></div>`;
    initCarousel(carouselId, trackWrap.querySelectorAll('.dot'), tabsId2);
  }
};

// ── SHOP ─────────────────────────────────────────────────────────────────────
let shopWk = S.shopWeek;

function renderShop() {
  const row = document.getElementById('shopWeekRow');
  row.innerHTML = WEEKS.map((w,i) => `<button class="wk-btn${i===shopWk?' active':''}" onclick="setShopWk(${i})">${w.label}</button>`).join('');
  renderShopList();
  document.getElementById('shopClear').onclick = () => { S.setChecked(shopWk,{}); renderShopList(); };
}
window.setShopWk = function(i) { shopWk = i; S.shopWeek = i; renderShop(); };

function renderShopList() {
  const week = WEEKS[shopWk];
  const checked = S.getChecked(shopWk);
  const all = Object.values(week.shopping).flat();
  const done = all.filter(x => checked[x.n]).length;
  const pct = all.length ? Math.round(done/all.length*100) : 0;

  document.getElementById('shopProg').innerHTML = `
    <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
    <div class="prog-lbl">${done} of ${all.length} items · ${pct}%</div>`;

  const catIcon = {'Produce & fresh':'Produce','Protein & chilled':'Protein','Grains & pasta':'Grains','Tins & jars':'Tins','Pantry staples':'Pantry','Specific this week':'This week'};

  document.getElementById('shopBody').innerHTML = Object.entries(week.shopping).map(([cat, items]) => `
    <div class="shop-cat">${catIcon[cat]||cat}</div>
    <div class="shop-list">${items.map(item => {
      const ticked = !!checked[item.n];
      const tag = item.s ? `<span class="item-tag t-sta">staple</span>` : item.r ? `<span class="item-tag t-rep">next week</span>` : '';
      const sn = item.n.replace(/'/g,"\\'");
      return `<div class="shop-row" onclick="tickItem(${shopWk},'${sn}')">
        <div class="chk${ticked?' ticked':''}">${ticked?'✓':''}</div>
        <span class="item-name${ticked?' ticked':''}">${item.n}</span>${tag}
      </div>`;
    }).join('')}</div>`).join('');
}
window.tickItem = function(wk, name) {
  const c = S.getChecked(parseInt(wk));
  c[name] = !c[name];
  S.setChecked(parseInt(wk), c);
  renderShopList();
};

// ── BRIGHTON ─────────────────────────────────────────────────────────────────
function renderBrighton() {
  const cont = document.getElementById('brightonSpots');
  if (cont.innerHTML) return;
  cont.innerHTML = BRIGHTON.map(cat => `
    <div class="spot-cat-hdr">${cat.cat}</div>
    ${cat.spots.map(spot => `
      <div class="spot-card">
        <div class="spot-card-name">${spot.name}</div>
        <div class="spot-card-addr">${spot.addr}</div>
        <div class="spot-card-desc">${spot.desc}</div>
        <div class="spot-tags-row">${spot.tags.map(t => `<span class="stag stag-${t.c}">${t.l}</span>`).join('')}</div>
      </div>`).join('')}`).join('');
}

// ── NUTRITION ─────────────────────────────────────────────────────────────────
function renderNutr() {
  const cont = document.getElementById('nutrCards');
  if (cont.innerHTML) return;
  cont.innerHTML = NUTR.map(item => `
    <div class="nutr-card">
      <div class="nutr-card-top">
        <span class="nutr-icon">${item.icon}</span>
        <span class="nutr-lbl">${item.label}</span>
        <span class="nutr-stat ns-${item.status}">${item.status==='good'?'Covered':item.status==='ok'?'Adequate':'Supplement'}</span>
      </div>
      <div class="nutr-det">${item.detail}</div>
    </div>`).join('');
}

// ── INIT ─────────────────────────────────────────────────────────────────────
window.planTabClick = function(trackId, idx) {
  const track = document.getElementById(trackId);
  if (track && track._goTo) track._goTo(idx);
};
window.todayTabClick = function(idx) {
  const track = document.getElementById('today-track');
  if (track && track._goTo) track._goTo(idx);
};
renderToday();
renderPlan();
renderShop();
</script>
