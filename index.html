<title>Gess & Sophie — Our Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --sage: #7A9E7E;
    --sage-light: #A8C5AB;
    --sage-pale: #EEF4EE;
    --clay: #C17F5A;
    --clay-light: #EACFB8;
    --clay-pale: #FBF3EC;
    --cream: #F7F2EB;
    --warm-white: #FDFAF6;
    --charcoal: #2D2D2A;
    --mid: #5A5A55;
    --soft: #8A8A82;
    --border: #E8E0D4;
    --on: #7A9E7E;
    --on-bg: #EEF4EE;
    --off: #6B8BB5;
    --off-bg: #EAF0F8;
    --cheat: #C17F5A;
    --cheat-bg: #FBF3EC;
    --gess: #8B6BAE;
    --gess-bg: #F2EEF8;
    --sophie: #6B8BB5;
    --sophie-bg: #EAF0F8;
    --both: #7A9E7E;
    --both-bg: #EEF4EE;
    --card: #FFFFFF;
    --bg: var(--warm-white);
    --surface: var(--cream);
    --text: var(--charcoal);
    --text-mid: var(--mid);
    --text-soft: var(--soft);
    --divider: var(--border);
    --shadow: 0 2px 12px rgba(45,45,42,0.07);
    --shadow-lg: 0 8px 32px rgba(45,45,42,0.12);
    --r: 16px;
    --r-sm: 10px;
    font-size: 16px;
  }
  [data-theme="dark"] {
    --cream: #1E1C18;
    --warm-white: #171510;
    --charcoal: #F0EBE1;
    --mid: #C8C4BC;
    --soft: #A8A8A0;
    --border: #3A3830;
    --card: #242220;
    --bg: #171510;
    --surface: #1E1C18;
    --text: #F0EBE1;
    --text-mid: #C8C4BC;
    --text-soft: #A8A8A0;
    --divider: #3A3830;
    --shadow: 0 2px 12px rgba(0,0,0,0.3);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
    --sage-pale: #1A2A1B;
    --clay-pale: #2A1E14;
    --on-bg: #162518;
    --on: #8FBF93;
    --off-bg: #141A26;
    --off: #7FA4CC;
    --cheat-bg: #261B10;
    --cheat: #D4956A;
    --gess-bg: #1C1428;
    --gess: #B090D4;
    --sophie-bg: #141A26;
    --sophie: #7FA4CC;
    --both-bg: #162518;
    --both: #8FBF93;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow: hidden; }
  
  /* APP SHELL */
  #app { display: flex; flex-direction: column; height: 100%; height: 100dvh; max-width: 600px; margin: 0 auto; position: relative; }
  
  /* HEADER */
  .app-header { padding: 16px 20px 12px; padding-top: calc(16px + env(safe-area-inset-top)); background: var(--bg); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; border-bottom: 1px solid var(--divider); }
  .app-title { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 400; color: var(--text); letter-spacing: -0.3px; }
  .app-title span { color: var(--sage); }
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--surface); color: var(--text-mid); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: background 0.15s; }
  .icon-btn:active { background: var(--divider); }
  
  /* NAV TABS */
  .nav-tabs { display: flex; background: var(--bg); border-bottom: 1px solid var(--divider); flex-shrink: 0; }
  .nav-tab { flex: 1; padding: 10px 4px 8px; border: none; background: none; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; color: var(--text-soft); letter-spacing: 0.02em; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: color 0.15s; position: relative; }
  .nav-tab .tab-icon { font-size: 20px; }
  .nav-tab.active { color: var(--sage); }
  [data-theme="dark"] .nav-tab:not(.active) { color: var(--text-soft); }
  .nav-tab.active::after { content: ''; position: absolute; bottom: 0; left: 20%; right: 20%; height: 2px; background: var(--sage); border-radius: 2px 2px 0 0; }
  
  /* SCROLL CONTENT */
  .scroll-content { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
  .screen { display: none; }
  .screen.active { display: block; }
  
  /* TODAY SCREEN */
  .today-hero { padding: 20px 20px 16px; }
  .today-greeting { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 400; line-height: 1.2; color: var(--text); margin-bottom: 4px; }
  .today-greeting em { font-style: italic; color: var(--clay); }
  .today-sub { font-size: 15px; color: var(--text-soft); margin-bottom: 16px; }
  .today-badges { display: flex; gap: 8px; flex-wrap: wrap; }

// ─── STATE ──────────────────────────────────────────────────────────────────

const S = {
  get theme(){ return localStorage.getItem('theme') || 'light'; },
  set theme(v){ localStorage.setItem('theme', v); },
  get currentWeek(){ return parseInt(localStorage.getItem('currentWeek') || '0'); },
  set currentWeek(v){ localStorage.setItem('currentWeek', String(v)); },
  get shopWeek(){ return parseInt(localStorage.getItem('shopWeek') || '0'); },
  set shopWeek(v){ localStorage.setItem('shopWeek', String(v)); },
  getChecked(week){ try{ return JSON.parse(localStorage.getItem('shopChecked_'+week) || '{}'); }catch(e){ return {}; } },
  setChecked(week, obj){ localStorage.setItem('shopChecked_'+week, JSON.stringify(obj)); },
  getTrainingDays(){ try{ return JSON.parse(localStorage.getItem('trainingDays') || '{}'); }catch(e){ return {}; } },
  setTrainingDays(obj){ localStorage.setItem('trainingDays', JSON.stringify(obj)); },
};

function todayKey(){
  const now = new Date();
  return `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`;
}
function todayDayIndex(){
  const d = new Date().getDay(); // 0=Sun
  return d === 0 ? 6 : d - 1; // Mon=0 ... Sun=6
}

// ─── THEME ──────────────────────────────────────────────────────────────────

function applyTheme(){
  document.documentElement.setAttribute('data-theme', S.theme);
  document.getElementById('themeToggle').textContent = S.theme === 'dark' ? '☀️' : '🌙';
}
document.getElementById('themeToggle').addEventListener('click', () => {
  S.theme = S.theme === 'dark' ? 'light' : 'dark';
  applyTheme();
});
applyTheme();

// ─── NAV ────────────────────────────────────────────────────────────────────

let currentScreen = 'today';
document.querySelectorAll('.nav-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    const scr = btn.dataset.screen;
    document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + scr).classList.add('active');
    currentScreen = scr;
    if(scr === 'today') renderToday();
    if(scr === 'plan') renderPlan();
    if(scr === 'shop') renderShop();
    if(scr === 'brighton') renderBrighton();
    if(scr === 'nutr') renderNutr();
  });
});

// ─── HELPERS ────────────────────────────────────────────────────────────────

function typeBadge(type, cls='badge'){
  const map = {ON:`<span class="${cls} badge-on">ON day</span>`, OFF:`<span class="${cls} badge-off">OFF day</span>`, CHEAT:`<span class="${cls} badge-cheat">Cheat day</span>`};
  return map[type] || '';
}
function personTag(who){
  return `<span class="person-tag ${who}">${who === 'both' ? '👫 Both' : who === 'sophie' ? '💙 Sophie' : '💜 Gess'}</span>`;
}
function sectionHTML(sec){
  const qtys = sec.qty && sec.qty.length ? `<div class="qty-chips">${sec.qty.map(q=>`<span class="qty-chip">${q}</span>`).join('')}</div>` : '';
  const nutrs = sec.nutr && sec.nutr.length ? `<div class="nutr-chips">${sec.nutr.map(n=>`<span class="nutr-chip">🌿 ${n}</span>`).join('')}</div>` : '';
  const seaweed = sec.seaweed ? `<div class="seaweed-chip">🌊 ${sec.seaweed}</div>` : '';
  const prep = sec.prep ? `<div class="prep-note">🌙 ${sec.prep}</div>` : '';
  return `<div class="meal-person-block">
    ${personTag(sec.who)}
    <div class="meal-title-text">${sec.title}</div>
    <div class="meal-desc-text">${sec.desc}</div>
    ${qtys}${nutrs}${seaweed}${prep}
  </div>`;
}

// ─── TODAY ──────────────────────────────────────────────────────────────────

function renderToday(){
  const wi = S.currentWeek;
  const di = todayDayIndex();
  const week = WEEKS[wi];
  const day = week.days[di];
  const now = new Date();
  const hours = now.getHours();
  const greet = hours < 12 ? 'Good morning' : hours < 17 ? 'Good afternoon' : 'Good evening';
  const dayNames = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

  document.getElementById('todayGreeting').innerHTML = `${greet}, <em>both</em> 👋`;
  document.getElementById('todaySub').textContent = `${dayNames[di]} · Week ${wi+1}`;

  const badges = document.getElementById('todayBadges');
  badges.innerHTML = typeBadge(day.type, 'day-type-badge') + (day.office ? `<span class="day-type-badge" style="background:var(--gess-bg);color:var(--gess);">💜 Gess office day</span>` : '');

  // Training toggle
  const td = S.getTrainingDays();
  const key = todayKey();
  const isTrain = !!td[key];
  const tog = document.getElementById('trainingToggle');
  tog.classList.toggle('on', isTrain);
  tog.onclick = () => {
    const td2 = S.getTrainingDays();
    td2[key] = !td2[key];
    S.setTrainingDays(td2);
    renderToday();
  };

  // Workout card
  const wc = document.getElementById('workoutCard');
  if(isTrain && day.type !== 'CHEAT'){
    wc.innerHTML = `<div class="workout-card"><div class="workout-card-title">🏋️ Training day add-on</div><div class="workout-card-desc"><strong>Post-workout:</strong> 200ml fresh apple juice + 250ml fortified plant milk + 20g protein powder (~180 kcal, ~22g protein)</div></div>`;
  } else { wc.innerHTML = ''; }

  // Meals
  const meals = document.getElementById('todayMeals');
  const kcalVal = day.type === 'ON' ? week.kcal.on : day.type === 'OFF' ? week.kcal.off : null;
  const kcalBadge = kcalVal ? `<span class="qty-chip" style="margin-left:auto">~${kcalVal} kcal/person</span>` : '';

  // Group sections by meal slot
  const snacks = day.sections.filter(s => s.icon === '🍎' || s.icon === '🥂');
  const lunches = day.sections.filter(s => s.icon === '🥗' || s.icon === '📍' || s.icon === '🏖️');
  const dinners = day.sections.filter(s => s.icon === '🌙');

  let html = '';
  if(kcalBadge) html += `<div style="display:flex;align-items:center;margin-bottom:8px;">${kcalBadge}</div>`;

  const slots = [{label:'Afternoon Snack', icon:'🍎', items:snacks},{label:'Lunch', icon:'🥗', items:lunches},{label:'Dinner', icon:'🌙', items:dinners}];
  slots.forEach(slot => {
    if(!slot.items.length) return;
    html += `<div class="meal-card">
      <div class="meal-card-header">
        <span class="meal-time-icon">${slot.icon}</span>
        <span class="meal-time-label">${slot.label}</span>
      </div>
      <div class="meal-card-body">
        ${slot.items.map(s => sectionHTML(s)).join('<div class="section-divider"></div>')}
      </div>
    </div>`;
  });
  meals.innerHTML = html;
}

// ─── PLAN ───────────────────────────────────────────────────────────────────

let planWeek = S.currentWeek;

function renderPlan(){
  const sel = document.getElementById('planWeekSelector');
  sel.innerHTML = WEEKS.map((w,i) => `<button class="week-btn${i===planWeek?' active':''}" onclick="setPlanWeek(${i})">${w.label}</button>`).join('');
  renderPlanDays();
}
window.setPlanWeek = function(i){
  planWeek = i;
  S.currentWeek = i;
  renderPlan();
};
function renderPlanDays(){
  const week = WEEKS[planWeek];
  const list = document.getElementById('planDayList');
  const td = S.getTrainingDays();
  list.innerHTML = week.days.map((day, di) => {
    const bc = day.type==='ON'?'badge-on':day.type==='OFF'?'badge-off':'badge-cheat';
    const bl = day.type==='CHEAT'?'Cheat day':day.type+' day';
    const kcalVal = day.type==='ON'?week.kcal.on:day.type==='OFF'?week.kcal.off:null;
    const kcalBadge = kcalVal?`<span class="small-badge badge-kcal">~${kcalVal} kcal</span>`:'';
    const officeBadge = day.office?`<span class="small-badge badge-office">💜 Gess office</span>`:'';
    const bodyId = `day-body-${planWeek}-${di}`;
    const chevId = `day-chev-${planWeek}-${di}`;
    return `<div class="day-pill">
      <div class="day-pill-header" onclick="toggleDayPlan('${bodyId}','${chevId}')">
        <span class="day-pill-name">${day.name}</span>
        <div class="day-badges">
          <span class="small-badge ${bc}">${bl}</span>
          ${officeBadge}${kcalBadge}
        </div>
        <span class="day-chevron" id="${chevId}">▼</span>
      </div>
      <div class="day-body" id="${bodyId}">
        ${day.sections.map(s => `<div class="day-meal-section">${sectionHTML(s)}</div>`).join('<div class="section-divider"></div>')}
        ${day.type !== 'CHEAT' ? `<div class="prep-note" style="margin-top:10px">🏋️ Training day: add 200ml apple juice + 250ml plant milk + 20g protein powder post-workout</div>` : ''}
      </div>
    </div>`;
  }).join('');
}
window.toggleDayPlan = function(bodyId, chevId){
  const body = document.getElementById(bodyId);
  const chev = document.getElementById(chevId);
  const open = body.classList.contains('open');
  body.classList.toggle('open', !open);
  if(chev) chev.classList.toggle('open', !open);
};

// ─── SHOPPING ───────────────────────────────────────────────────────────────

let shopWk = S.shopWeek;

function renderShop(){
  const sel = document.getElementById('shopWeekSelector');
  sel.innerHTML = WEEKS.map((w,i) => `<button class="week-btn${i===shopWk?' active':''}" onclick="setShopWeek(${i})">${w.label}</button>`).join('');
  renderShopItems();
  document.getElementById('shopClearBtn').onclick = () => {
    S.setChecked(shopWk, {});
    renderShopItems();
  };
}
window.setShopWeek = function(i){
  shopWk = i;
  S.shopWeek = i;
  renderShop();
};
function renderShopItems(){
  const week = WEEKS[shopWk];
  const checked = S.getChecked(shopWk);
  const allItems = [];
  Object.values(week.shopping).forEach(items => allItems.push(...items));
  const total = allItems.length;
  const done = allItems.filter(item => checked[item.n]).length;
  const pct = total > 0 ? Math.round((done/total)*100) : 0;

  document.getElementById('shopProgress').innerHTML = `
    <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">${done} of ${total} items ticked · ${pct}%</div>`;

  const cont = document.getElementById('shopContent');
  cont.innerHTML = Object.entries(week.shopping).map(([cat, items]) => {
    const catEmoji = {
      'Produce & fresh':'🥬','Protein & chilled':'🧊','Grains & pasta':'🌾',
      'Tins & jars':'🥫','Pantry staples':'🫙','Specific this week':'📝'
    }[cat] || '📦';
    return `<div class="shop-category">
      <div class="shop-cat-title">${catEmoji} ${cat}</div>
      <div class="shop-items">
        ${items.map(item => {
          const isChecked = !!checked[item.n];
          const tagHtml = item.s ? `<span class="shop-item-tag tag-staple">staple</span>` : item.r ? `<span class="shop-item-tag tag-repeat">next week too</span>` : '';
          const checkedClass = isChecked ? ' checked' : '';
          const checkedMark = isChecked ? '✓' : '';
          const safeName = item.n.replace(/'/g, "\\'");
          return `<div class="shop-item" onclick="toggleShopItem('${shopWk}','${safeName}')">
            <div class="shop-check${checkedClass}">${checkedMark}</div>
            <span class="shop-item-name${checkedClass}">${item.n}</span>
            ${tagHtml}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}
window.toggleShopItem = function(week, name){
  const checked = S.getChecked(parseInt(week));
  checked[name] = !checked[name];
  S.setChecked(parseInt(week), checked);
  renderShopItems();
};

// ─── BRIGHTON ───────────────────────────────────────────────────────────────

function renderBrighton(){
  const cont = document.getElementById('brightonSpots');
  if(cont.innerHTML) return;
  cont.innerHTML = BRIGHTON.map(cat => `
    <div class="spot-cat-title">${cat.emoji} ${cat.cat}</div>
    ${cat.spots.map(spot => `
      <div class="spot-card">
        <div class="spot-name">${spot.name}</div>
        <div class="spot-addr">📍 ${spot.addr}</div>
        <div class="spot-desc">${spot.desc}</div>
        <div class="spot-tags">${spot.tags.map(t => `<span class="spot-tag spot-tag-${t.c}">${t.l}</span>`).join('')}</div>
      </div>`).join('')}
  `).join('');
}

// ─── NUTRITION ──────────────────────────────────────────────────────────────

function renderNutr(){
  const cont = document.getElementById('nutrCards');
  if(cont.innerHTML) return;
  cont.innerHTML = NUTR.map(item => `
    <div class="nutr-card">
      <div class="nutr-card-header">
        <span class="nutr-icon">${item.icon}</span>
        <span class="nutr-label">${item.label}</span>
        <span class="nutr-status status-${item.status}">${item.status === 'good' ? 'Covered' : item.status === 'ok' ? 'Adequate' : '⚠️ Supplement'}</span>
      </div>
      <div class="nutr-detail">${item.detail}</div>
    </div>`).join('');
}

// ─── INIT ───────────────────────────────────────────────────────────────────

renderToday();
renderPlan();
renderShop();
</script>
</body>
</html>
